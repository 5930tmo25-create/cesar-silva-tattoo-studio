<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Digital clock displaying current time across multiple time zones worldwide">
    <title>World Clock | Multiple Time Zones</title>
    <link rel="stylesheet" href="styles/world-clock.css">
</head>
<body>
    <div class="clock-container">
        <!-- Header -->
        <header class="header">
            <h1>⏰ World Clock</h1>
            <p class="subtitle">Real-time display across multiple time zones</p>
        </header>

        <!-- Controls -->
        <div class="controls">
            <div class="format-toggle">
                <button class="btn btn-toggle active" data-format="12">12-Hour</button>
                <button class="btn btn-toggle" data-format="24">24-Hour</button>
            </div>
            <button class="btn btn-reset">Reset</button>
        </div>

        <!-- Search and Filter -->
        <div class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                class="search-box" 
                placeholder="🔍 Search city or timezone..."
                aria-label="Search clocks"
            >
        </div>

        <!-- Clocks Grid -->
        <div class="clocks-grid" id="clocksGrid">
            <!-- Clock cards will be generated by JavaScript -->
        </div>

        <!-- Info Section -->
        <div class="info-section">
            <h3>ℹ️ About This Clock</h3>
            <p>This world clock displays the current time in major cities across all time zones. Times update every second and automatically adjust for daylight saving time. Click on any card to see more details.</p>
        </div>
    </div>

    <script src="js/world-clock.js"></script>
</body>
</html>
